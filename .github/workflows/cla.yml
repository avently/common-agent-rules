name: "CLA Assistant"
on:
  issue_comment:
    types: [created]
  pull_request_target:
    types: [opened, closed, synchronize]

permissions:
  actions: write
  contents: read
  pull-requests: write
  statuses: write

jobs:
  CLAAssistant:
    runs-on: ubuntu-latest
    steps:
      - name: "CLA Assistant"
        if: (github.event.comment.body == 'recheck' || github.event.comment.body == 'I have read the CLA Document and I hereby sign the CLA') || github.event_name == 'pull_request_target'
        # v2.6.1, pinned by commit because the action repository is archived
        uses: contributor-assistant/github-action@ca4a40a7d1004f18d9960b404b97e5f30a505a08
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PERSONAL_ACCESS_TOKEN: ${{ secrets.CLA_ACCESS_TOKEN }}
        with:
          path-to-document: "https://github.com/avently/cla/blob/main/CLA.md"
          remote-organization-name: "avently"
          remote-repository-name: "cla"
          path-to-signatures: "signatures/v1/cla.json"
          branch: "main"
          allowlist: "avently,dependabot[bot],renovate[bot],github-actions[bot]"
          custom-notsigned-prcomment: "Thank you for your contribution! Before we can accept it, please read our [Contributor License Agreement](https://github.com/avently/cla/blob/main/CLA.md) and sign it by posting the comment below. You sign only once: the signature applies to all projects of @avently."
